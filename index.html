<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#0ea5e9" />
    <meta name="description" content="Carl Stahl CoC Certificate Management System - Abu Dhabi" />

    <!-- Favicon -->
    <link
      rel="icon"
      type="image/x-icon"
      href="https://www.carlstahl.com/images/favicon.ico"
    />
    <link
      rel="shortcut icon"
      href="https://www.carlstahl.com/images/favicon.ico"
      type="image/x-icon"
    />

    <!-- Preconnect for performance -->
    <link rel="preconnect" href="https://script.google.com" />

    <title>CoC Certificate Management | Carl Stahl Abu Dhabi</title>
    <style>
      /* ========== CSS Variables (Light Blue Theme) ========== */
      :root {
        --primary: #0ea5e9;
        --primary-dark: #0284c7;
        --primary-light: #38bdf8;
        --primary-gradient: linear-gradient(135deg, #0ea5e9 0%, #06b6d4 100%);
        --accent: #06b6d4;
        --accent-hover: #0891b2;
        --bg-gradient: linear-gradient(135deg, #f0f9ff 0%, #e0f2fe 50%, #f0f9ff 100%);
        --glass-bg: rgba(255, 255, 255, 0.7);
        --glass-border: rgba(14, 165, 233, 0.2);
        --text-primary: #0c4a6e;
        --text-secondary: #075985;
        --text-tertiary: #0284c7;
        --shadow-sm: 0 2px 8px rgba(14, 165, 233, 0.08);
        --shadow-md: 0 4px 16px rgba(14, 165, 233, 0.12);
        --shadow-lg: 0 12px 40px rgba(14, 165, 233, 0.15);
        --shadow-glow: 0 0 30px rgba(14, 165, 233, 0.3);
        --radius-sm: 8px;
        --radius-md: 12px;
        --radius-lg: 16px;
        --radius-xl: 20px;
        --transition-fast: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        --transition-smooth: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        --safe-area-top: env(safe-area-inset-top, 0px);
        --safe-area-bottom: env(safe-area-inset-bottom, 0px);
      }

      /* ========== Reset & Base ========== */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        overscroll-behavior: none;
      }

      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue",
          Arial, sans-serif;
        background: var(--bg-gradient);
        background-attachment: fixed;
        display: flex;
        flex-direction: column;
        color: var(--text-primary);
        position: relative;
      }

      /* Animated background pattern */
      body::before {
        content: '';
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: 
          radial-gradient(circle at 20% 30%, rgba(14, 165, 233, 0.08) 0%, transparent 50%),
          radial-gradient(circle at 80% 70%, rgba(6, 182, 212, 0.06) 0%, transparent 50%),
          radial-gradient(circle at 50% 50%, rgba(56, 189, 248, 0.04) 0%, transparent 50%);
        pointer-events: none;
        z-index: 0;
        animation: float 20s ease-in-out infinite;
      }

      @keyframes float {
        0%, 100% {
          transform: translate(0, 0) scale(1);
        }
        33% {
          transform: translate(30px, -30px) scale(1.05);
        }
        66% {
          transform: translate(-20px, 20px) scale(0.95);
        }
      }

      /* ========== Header ========== */
      .header {
        background: var(--glass-bg);
        backdrop-filter: blur(20px) saturate(180%);
        -webkit-backdrop-filter: blur(20px) saturate(180%);
        border-bottom: 1px solid var(--glass-border);
        padding: 16px 20px;
        padding-top: calc(16px + var(--safe-area-top));
        display: flex;
        align-items: center;
        justify-content: space-between;
        z-index: 100;
        position: relative;
        box-shadow: var(--shadow-sm);
      }

      .header-content {
        display: flex;
        align-items: center;
        gap: 14px;
        flex: 1;
        min-width: 0;
      }

      .logo-wrapper {
        position: relative;
        width: 48px;
        height: 48px;
        flex-shrink: 0;
      }

      .logo-bg {
        position: absolute;
        inset: 0;
        background: var(--primary-gradient);
        border-radius: var(--radius-md);
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: var(--shadow-glow);
        animation: pulse-logo 3s ease-in-out infinite;
      }

      @keyframes pulse-logo {
        0%, 100% {
          box-shadow: var(--shadow-glow);
          transform: scale(1);
        }
        50% {
          box-shadow: 0 0 40px rgba(14, 165, 233, 0.5);
          transform: scale(1.03);
        }
      }

      .logo-icon {
        width: 28px;
        height: 28px;
        color: white;
        position: relative;
        z-index: 1;
      }

      .title-section {
        display: flex;
        flex-direction: column;
        gap: 3px;
        min-width: 0;
        flex: 1;
      }

      .title-main {
        font-size: 17px;
        font-weight: 700;
        color: var(--text-primary);
        letter-spacing: -0.02em;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }

      .title-sub {
        font-size: 12px;
        font-weight: 500;
        color: var(--text-secondary);
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .location-badge {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        padding: 3px 10px;
        background: linear-gradient(135deg, rgba(14, 165, 233, 0.1) 0%, rgba(6, 182, 212, 0.1) 100%);
        border: 1px solid rgba(14, 165, 233, 0.25);
        border-radius: 12px;
        font-size: 10px;
        font-weight: 600;
        color: var(--primary);
        text-transform: uppercase;
        letter-spacing: 0.03em;
      }

      .location-icon {
        width: 10px;
        height: 10px;
        fill: currentColor;
      }

      .status-indicator {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        padding: 3px 10px;
        background: linear-gradient(135deg, rgba(16, 185, 129, 0.1) 0%, rgba(5, 150, 105, 0.1) 100%);
        border: 1px solid rgba(16, 185, 129, 0.25);
        border-radius: 12px;
        font-size: 10px;
        font-weight: 600;
        color: #10b981;
        text-transform: uppercase;
        letter-spacing: 0.03em;
      }

      .status-dot {
        width: 6px;
        height: 6px;
        background: #10b981;
        border-radius: 50%;
        animation: pulse-dot 2s ease-in-out infinite;
      }

      @keyframes pulse-dot {
        0%, 100% {
          opacity: 1;
          box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7);
        }
        50% {
          opacity: 0.7;
          box-shadow: 0 0 0 4px rgba(16, 185, 129, 0);
        }
      }

      .header-actions {
        display: flex;
        gap: 8px;
        flex-shrink: 0;
      }

      .action-btn {
        width: 42px;
        height: 42px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, rgba(14, 165, 233, 0.08) 0%, rgba(6, 182, 212, 0.08) 100%);
        border: 1px solid var(--glass-border);
        border-radius: var(--radius-md);
        cursor: pointer;
        transition: all var(--transition-fast);
        color: var(--primary);
        position: relative;
        overflow: hidden;
      }

      .action-btn::before {
        content: '';
        position: absolute;
        inset: 0;
        background: var(--primary-gradient);
        opacity: 0;
        transition: opacity var(--transition-fast);
      }

      .action-btn:hover {
        border-color: var(--primary);
        box-shadow: var(--shadow-glow);
        transform: translateY(-2px);
      }

      .action-btn:hover::before {
        opacity: 0.15;
      }

      .action-btn:active {
        transform: translateY(0) scale(0.95);
      }

      .action-btn svg {
        width: 20px;
        height: 20px;
        position: relative;
        z-index: 1;
        transition: all var(--transition-fast);
      }

      .action-btn:hover svg {
        color: var(--primary-dark);
      }

      .action-btn.spinning svg {
        animation: spin 0.6s cubic-bezier(0.68, -0.55, 0.265, 1.55);
      }

      @keyframes spin {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }

      /* ========== Main Content ========== */
      .main-wrapper {
        flex: 1;
        padding: 16px;
        padding-bottom: calc(16px + var(--safe-area-bottom));
        display: flex;
        flex-direction: column;
        overflow: hidden;
        position: relative;
        z-index: 1;
      }

      .content-card {
        flex: 1;
        background: var(--glass-bg);
        backdrop-filter: blur(20px) saturate(180%);
        -webkit-backdrop-filter: blur(20px) saturate(180%);
        border: 1px solid var(--glass-border);
        border-radius: var(--radius-xl);
        overflow: hidden;
        box-shadow: var(--shadow-lg);
        position: relative;
        display: flex;
        flex-direction: column;
      }

      /* Shimmer effect */
      .content-card::before {
        content: '';
        position: absolute;
        top: 0;
        left: -100%;
        width: 100%;
        height: 100%;
        background: linear-gradient(
          90deg,
          transparent,
          rgba(255, 255, 255, 0.4),
          transparent
        );
        animation: shimmer 3s infinite;
        pointer-events: none;
        z-index: 1;
      }

      @keyframes shimmer {
        to {
          left: 100%;
        }
      }

      .iframe-box {
        flex: 1;
        position: relative;
        background: white;
        overflow: hidden;
      }

      iframe {
        width: 100%;
        height: 100%;
        border: none;
        display: block;
        background: white;
      }

      /* ========== Loading State ========== */
      .loading-screen {
        position: absolute;
        inset: 0;
        background: linear-gradient(135deg, #f0f9ff 0%, #e0f2fe 100%);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 50;
        transition: opacity var(--transition-smooth), visibility var(--transition-smooth);
      }

      .loading-screen.hidden {
        opacity: 0;
        visibility: hidden;
      }

      .spinner-container {
        position: relative;
        width: 120px;
        height: 120px;
        margin-bottom: 36px;
      }

      .spinner-ring {
        position: absolute;
        inset: 0;
        border-radius: 50%;
      }

      .spinner-ring-1 {
        border: 4px solid transparent;
        border-top-color: var(--primary);
        animation: rotate-ring 1.5s cubic-bezier(0.68, -0.55, 0.265, 1.55) infinite;
      }

      .spinner-ring-2 {
        border: 4px solid transparent;
        border-right-color: var(--accent);
        animation: rotate-ring 2s cubic-bezier(0.68, -0.55, 0.265, 1.55) infinite reverse;
        animation-delay: 0.3s;
      }

      .spinner-ring-3 {
        border: 4px solid transparent;
        border-bottom-color: var(--primary-light);
        animation: rotate-ring 2.5s cubic-bezier(0.68, -0.55, 0.265, 1.55) infinite;
        animation-delay: 0.6s;
      }

      @keyframes rotate-ring {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }

      .spinner-core {
        position: absolute;
        inset: 30px;
        background: var(--primary-gradient);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: var(--shadow-glow);
        animation: pulse-core 2s ease-in-out infinite;
      }

      @keyframes pulse-core {
        0%, 100% {
          transform: scale(1);
          box-shadow: var(--shadow-glow);
        }
        50% {
          transform: scale(1.08);
          box-shadow: 0 0 40px rgba(14, 165, 233, 0.5);
        }
      }

      .spinner-icon {
        width: 36px;
        height: 36px;
        color: white;
      }

      .loading-info {
        text-align: center;
        max-width: 300px;
      }

      .loading-title {
        font-size: 22px;
        font-weight: 700;
        color: var(--text-primary);
        margin-bottom: 10px;
        letter-spacing: -0.02em;
      }

      .loading-desc {
        font-size: 14px;
        color: var(--text-secondary);
        margin-bottom: 28px;
        line-height: 1.5;
      }

      .progress-bar-wrapper {
        width: 220px;
        height: 4px;
        background: rgba(14, 165, 233, 0.15);
        border-radius: 2px;
        overflow: hidden;
        margin: 0 auto 28px;
      }

      .progress-bar {
        height: 100%;
        background: var(--primary-gradient);
        border-radius: 2px;
        animation: progress-move 2s ease-in-out infinite;
      }

      @keyframes progress-move {
        0% {
          width: 0%;
          transform: translateX(0);
        }
        50% {
          width: 75%;
        }
        100% {
          width: 100%;
          transform: translateX(100%);
        }
      }

      .loading-metrics {
        display: flex;
        gap: 32px;
        justify-content: center;
      }

      .metric-box {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
      }

      .metric-value {
        font-size: 20px;
        font-weight: 700;
        background: var(--primary-gradient);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }

      .metric-label {
        font-size: 11px;
        color: var(--text-tertiary);
        text-transform: uppercase;
        letter-spacing: 0.05em;
        font-weight: 600;
      }

      /* ========== Error State ========== */
      .error-screen {
        position: absolute;
        inset: 0;
        background: linear-gradient(135deg, #fef2f2 0%, #fee2e2 100%);
        display: none;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 60;
        padding: 32px;
      }

      .error-screen.visible {
        display: flex;
      }

      .error-icon-box {
        width: 90px;
        height: 90px;
        background: linear-gradient(135deg, rgba(239, 68, 68, 0.1) 0%, rgba(220, 38, 38, 0.1) 100%);
        border: 2px solid rgba(239, 68, 68, 0.3);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 28px;
        animation: shake 0.6s ease-in-out;
      }

      @keyframes shake {
        0%, 100% { transform: translateX(0) rotate(0deg); }
        25% { transform: translateX(-12px) rotate(-5deg); }
        50% { transform: translateX(12px) rotate(5deg); }
        75% { transform: translateX(-12px) rotate(-5deg); }
      }

      .error-icon {
        font-size: 44px;
      }

      .error-info {
        text-align: center;
        max-width: 340px;
      }

      .error-title {
        font-size: 24px;
        font-weight: 700;
        color: #991b1b;
        margin-bottom: 12px;
        letter-spacing: -0.02em;
      }

      .error-text {
        font-size: 15px;
        color: #b91c1c;
        line-height: 1.6;
        margin-bottom: 32px;
      }

      .error-buttons {
        display: flex;
        gap: 12px;
        justify-content: center;
        flex-wrap: wrap;
      }

      .btn {
        padding: 14px 28px;
        border-radius: var(--radius-md);
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
        transition: all var(--transition-fast);
        border: none;
        display: inline-flex;
        align-items: center;
        gap: 10px;
        position: relative;
        overflow: hidden;
        white-space: nowrap;
      }

      .btn-primary {
        background: var(--primary-gradient);
        color: white;
        box-shadow: var(--shadow-md);
      }

      .btn-primary:hover {
        box-shadow: var(--shadow-glow);
        transform: translateY(-3px);
      }

      .btn-primary:active {
        transform: translateY(-1px);
      }

      .btn-secondary {
        background: white;
        color: var(--primary);
        border: 2px solid var(--primary);
      }

      .btn-secondary:hover {
        background: var(--primary);
        color: white;
        transform: translateY(-3px);
      }

      /* ========== Toast Notifications ========== */
      .toast-wrapper {
        position: fixed;
        top: calc(82px + var(--safe-area-top));
        left: 50%;
        transform: translateX(-50%);
        z-index: 200;
        pointer-events: none;
      }

      .toast {
        background: var(--glass-bg);
        backdrop-filter: blur(20px) saturate(180%);
        -webkit-backdrop-filter: blur(20px) saturate(180%);
        border: 1px solid var(--glass-border);
        border-radius: var(--radius-md);
        padding: 14px 22px;
        display: flex;
        align-items: center;
        gap: 12px;
        box-shadow: var(--shadow-lg);
        animation: toast-slide-in 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        pointer-events: all;
        min-width: 220px;
        max-width: 360px;
      }

      @keyframes toast-slide-in {
        from {
          opacity: 0;
          transform: translateY(-30px) scale(0.8);
        }
        to {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }

      .toast.toast-exit {
        animation: toast-slide-out 0.3s ease-in forwards;
      }

      @keyframes toast-slide-out {
        to {
          opacity: 0;
          transform: translateY(-30px) scale(0.8);
        }
      }

      .toast-icon {
        width: 28px;
        height: 28px;
        flex-shrink: 0;
        font-size: 20px;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .toast-text {
        font-size: 14px;
        color: var(--text-primary);
        font-weight: 500;
        line-height: 1.4;
      }

      /* ========== Responsive Design ========== */
      @media (max-width: 480px) {
        .header {
          padding: 12px 16px;
          padding-top: calc(12px + var(--safe-area-top));
        }

        .logo-wrapper {
          width: 44px;
          height: 44px;
        }

        .logo-icon {
          width: 24px;
          height: 24px;
        }

        .title-main {
          font-size: 15px;
        }

        .title-sub {
          font-size: 11px;
        }

        .action-btn {
          width: 38px;
          height: 38px;
        }

        .main-wrapper {
          padding: 12px;
          padding-bottom: calc(12px + var(--safe-area-bottom));
        }

        .content-card {
          border-radius: var(--radius-lg);
        }

        .loading-title {
          font-size: 20px;
        }

        .spinner-container {
          width: 100px;
          height: 100px;
          margin-bottom: 28px;
        }

        .spinner-core {
          inset: 25px;
        }

        .spinner-icon {
          width: 30px;
          height: 30px;
        }
      }

      @media (max-width: 380px) {
        .title-sub .location-badge {
          display: none;
        }

        .loading-metrics {
          flex-direction: column;
          gap: 16px;
        }

        .error-buttons {
          flex-direction: column;
          width: 100%;
        }

        .btn {
          width: 100%;
          justify-content: center;
        }
      }

      @media (orientation: landscape) and (max-height: 500px) {
        .header {
          padding: 8px 16px;
          padding-top: calc(8px + var(--safe-area-top));
        }

        .main-wrapper {
          padding: 8px;
          padding-bottom: calc(8px + var(--safe-area-bottom));
        }

        .spinner-container {
          width: 80px;
          height: 80px;
          margin-bottom: 20px;
        }

        .spinner-core {
          inset: 20px;
        }

        .spinner-icon {
          width: 24px;
          height: 24px;
        }

        .loading-metrics {
          margin-top: 16px;
        }
      }

      /* ========== Accessibility ========== */
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }
      }

      /* Focus visible for keyboard navigation */
      .action-btn:focus-visible,
      .btn:focus-visible {
        outline: 3px solid var(--primary);
        outline-offset: 2px;
      }

      /* ========== Print Styles ========== */
      @media print {
        .header,
        .loading-screen,
        .error-screen {
          display: none !important;
        }

        .main-wrapper {
          padding: 0;
        }

        .content-card {
          border: none;
          box-shadow: none;
        }
      }
    </style>
  </head>
  <body>
    <!-- Header -->
    <header class="header" role="banner">
      <div class="header-content">
        <div class="logo-wrapper">
          <div class="logo-bg">
            <svg class="logo-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="20 6 9 17 4 12"></polyline>
            </svg>
          </div>
        </div>
        <div class="title-section">
          <h1 class="title-main">CoC Certificate Management</h1>
          <div class="title-sub">
            <span class="location-badge">
              <svg class="location-icon" viewBox="0 0 24 24" fill="currentColor">
                <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/>
              </svg>
              Abu Dhabi
            </span>
            <span class="status-indicator">
              <span class="status-dot"></span>
              <span>Active</span>
            </span>
          </div>
        </div>
      </div>
      <div class="header-actions">
        <button
          class="action-btn"
          id="refreshBtn"
          aria-label="Refresh certificate system"
          title="Refresh"
        >
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21.5 2v6h-6M2.5 22v-6h6M2 11.5a10 10 0 0 1 18.8-4.3M22 12.5a10 10 0 0 1-18.8 4.2"/>
          </svg>
        </button>
        <button
          class="action-btn"
          id="fullscreenBtn"
          aria-label="Toggle fullscreen mode"
          title="Fullscreen"
        >
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/>
          </svg>
        </button>
      </div>
    </header>

    <!-- Main Content -->
    <main class="main-wrapper" role="main">
      <div class="content-card">
        <div class="iframe-box">
          <!-- Loading Screen -->
          <div class="loading-screen" id="loadingScreen" role="status" aria-live="polite">
            <div class="spinner-container">
              <div class="spinner-ring spinner-ring-1"></div>
              <div class="spinner-ring spinner-ring-2"></div>
              <div class="spinner-ring spinner-ring-3"></div>
              <div class="spinner-core">
                <svg class="spinner-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                  <polyline points="20 6 9 17 4 12"></polyline>
                </svg>
              </div>
            </div>
            <div class="loading-info">
              <h2 class="loading-title">Loading Certificate System</h2>
              <p class="loading-desc">Connecting to Carl Stahl Abu Dhabi portal...</p>
              <div class="progress-bar-wrapper">
                <div class="progress-bar"></div>
              </div>
              <div class="loading-metrics">
                <div class="metric-box">
                  <span class="metric-value" id="loadTimer">0s</span>
                  <span class="metric-label">Time</span>
                </div>
                <div class="metric-box">
                  <span class="metric-value">🔒</span>
                  <span class="metric-label">Secure</span>
                </div>
              </div>
            </div>
          </div>

          <!-- Error Screen -->
          <div class="error-screen" id="errorScreen" role="alert" aria-live="assertive">
            <div class="error-icon-box">
              <span class="error-icon">⚠️</span>
            </div>
            <div class="error-info">
              <h2 class="error-title">Connection Error</h2>
              <p class="error-text">
                We couldn't establish a connection to the certificate management system.
                Please verify your internet connection and try again.
              </p>
              <div class="error-buttons">
                <button class="btn btn-primary" onclick="reloadCertificateSystem()">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M21.5 2v6h-6M2.5 22v-6h6M2 11.5a10 10 0 0 1 18.8-4.3M22 12.5a10 10 0 0 1-18.8 4.2"/>
                  </svg>
                  Retry Connection
                </button>
                <button class="btn btn-secondary" onclick="window.location.reload()">
                  Reload Page
                </button>
              </div>
            </div>
          </div>

          <!-- Certificate System Iframe -->
          <iframe
            id="certIframe"
            src="https://script.google.com/macros/s/AKfycbxHGrZhC0crK8cvBjfmzmuSgComH-KHkcXsqXW3tC8RCQ3aynZnbWOt6BguTRG25N5asw/exec"
            allowfullscreen="true"
            title="CoC Certificate Management System - Abu Dhabi"
            loading="eager"
          ></iframe>
        </div>
      </div>
    </main>

    <!-- Toast Container -->
    <div class="toast-wrapper" id="toastWrapper"></div>

    <script>
      // ========== DOM Elements ==========
      const elements = {
        loadingScreen: document.getElementById('loadingScreen'),
        errorScreen: document.getElementById('errorScreen'),
        certIframe: document.getElementById('certIframe'),
        refreshBtn: document.getElementById('refreshBtn'),
        fullscreenBtn: document.getElementById('fullscreenBtn'),
        toastWrapper: document.getElementById('toastWrapper'),
        loadTimer: document.getElementById('loadTimer')
      };

      // ========== State Management ==========
      let loadTimeout;
      let loadStartTime = Date.now();
      let timerInterval;
      let autoFullscreenAttempted = false;

      // ========== Timer Functions ==========
      function startLoadTimer() {
        loadStartTime = Date.now();
        timerInterval = setInterval(() => {
          const elapsedSeconds = Math.floor((Date.now() - loadStartTime) / 1000);
          elements.loadTimer.textContent = `${elapsedSeconds}s`;
        }, 100);
      }

      function stopLoadTimer() {
        if (timerInterval) {
          clearInterval(timerInterval);
          timerInterval = null;
        }
      }

      // ========== Toast Notifications ==========
      function showToast(message, icon = '✓', duration = 3500) {
        const toast = document.createElement('div');
        toast.className = 'toast';
        toast.innerHTML = `
          <div class="toast-icon">${icon}</div>
          <div class="toast-text">${message}</div>
        `;
        
        elements.toastWrapper.appendChild(toast);
        
        setTimeout(() => {
          toast.classList.add('toast-exit');
          setTimeout(() => toast.remove(), 300);
        }, duration);
      }

      // ========== Iframe Event Handlers ==========
      elements.certIframe.addEventListener('load', function () {
        clearTimeout(loadTimeout);
        stopLoadTimer();
        
        setTimeout(() => {
          elements.loadingScreen.classList.add('hidden');
          showToast('Certificate system loaded successfully', '✓');
          
          // Auto-enter fullscreen on first load (user gesture required)
          if (!autoFullscreenAttempted) {
            autoFullscreenAttempted = true;
            setTimeout(attemptAutoFullscreen, 1000);
          }
        }, 600);
      });

      elements.certIframe.addEventListener('error', function () {
        handleConnectionError();
      });

      // ========== Error Handling ==========
      function handleConnectionError() {
        clearTimeout(loadTimeout);
        stopLoadTimer();
        elements.loadingScreen.classList.add('hidden');
        elements.errorScreen.classList.add('visible');
        showToast('Connection failed', '⚠️');
      }

      // Set loading timeout
      function setLoadingTimeout() {
        loadTimeout = setTimeout(() => {
          handleConnectionError();
        }, 25000); // 25 second timeout
      }

      // ========== System Reload ==========
      function reloadCertificateSystem() {
        elements.errorScreen.classList.remove('visible');
        elements.loadingScreen.classList.remove('hidden');
        elements.loadTimer.textContent = '0s';
        
        startLoadTimer();
        setLoadingTimeout();
        
        // Force iframe reload
        const iframeSrc = elements.certIframe.src;
        elements.certIframe.src = '';
        setTimeout(() => {
          elements.certIframe.src = iframeSrc;
        }, 150);
        
        showToast('Reconnecting to system...', '🔄');
      }

      // ========== Refresh Button ==========
      elements.refreshBtn.addEventListener('click', function () {
        this.classList.add('spinning');
        setTimeout(() => {
          this.classList.remove('spinning');
        }, 600);
        
        reloadCertificateSystem();
      });

      // ========== Fullscreen Functionality ==========
      function attemptAutoFullscreen() {
        if (!document.fullscreenElement) {
          document.documentElement.requestFullscreen().catch(err => {
            console.log('Auto-fullscreen blocked (user gesture required):', err);
          });
        }
      }

      elements.fullscreenBtn.addEventListener('click', function () {
        if (!document.fullscreenElement) {
          document.documentElement.requestFullscreen().catch(err => {
            showToast('Fullscreen mode unavailable', '⚠️');
            console.error('Fullscreen error:', err);
          });
        } else {
          document.exitFullscreen();
        }
      });

      // Update fullscreen button icon
      document.addEventListener('fullscreenchange', function () {
        const btnSvg = elements.fullscreenBtn.querySelector('svg');
        if (document.fullscreenElement) {
          btnSvg.innerHTML = `
            <path d="M8 3v3a2 2 0 0 1-2 2H3m18 0h-3a2 2 0 0 1-2-2V3m0 18v-3a2 2 0 0 1 2-2h3M3 16h3a2 2 0 0 1 2 2v3" />
          `;
          showToast('Fullscreen mode activated', '⛶');
        } else {
          btnSvg.innerHTML = `
            <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3" />
          `;
        }
      });

      // ========== Touch & Gesture Controls ==========
      
      // Prevent double-tap zoom
      let lastTouchEnd = 0;
      document.addEventListener('touchend', function (event) {
        const now = Date.now();
        if (now - lastTouchEnd <= 300) {
          event.preventDefault();
        }
        lastTouchEnd = now;
      }, false);

      // Prevent pull-to-refresh on body
      let touchStartY = 0;
      document.body.addEventListener('touchstart', function (e) {
        touchStartY = e.touches[0].pageY;
      }, { passive: true });

      document.body.addEventListener('touchmove', function (e) {
        const touchY = e.touches[0].pageY;
        if (window.scrollY === 0 && touchY > touchStartY && !elements.certIframe.contains(e.target)) {
          e.preventDefault();
        }
      }, { passive: false });

      // ========== Orientation Change ==========
      window.addEventListener('orientationchange', function () {
        setTimeout(() => {
          window.scrollTo(0, 0);
        }, 100);
      });

      // ========== Page Visibility ==========
      document.addEventListener('visibilitychange', function () {
        if (document.visibilityState === 'visible') {
          console.log('Page is now visible - certificate system active');
        }
      });

      // ========== Keyboard Shortcuts ==========
      document.addEventListener('keydown', function (e) {
        // F5 or Ctrl+R - Refresh
        if (e.key === 'F5' || (e.ctrlKey && e.key === 'r')) {
          e.preventDefault();
          reloadCertificateSystem();
        }
        
        // F11 - Fullscreen toggle
        if (e.key === 'F11') {
          e.preventDefault();
          elements.fullscreenBtn.click();
        }
      });

      // ========== Initialize Application ==========
      function initializeApp() {
        console.log('🚀 CoC Certificate Management System - Abu Dhabi');
        console.log('📍 Carl Stahl for Industry Company');
        console.log('🔒 Secure connection established');
        
        startLoadTimer();
        setLoadingTimeout();
      }

      // ========== Performance Monitoring ==========
      window.addEventListener('load', () => {
        if (window.performance) {
          const perfData = window.performance.timing;
          const pageLoadTime = perfData.loadEventEnd - perfData.navigationStart;
          console.log(`⚡ Page load time: ${pageLoadTime}ms`);
        }
      });

      // ========== Error Boundary ==========
      window.addEventListener('error', function (e) {
        console.error('Application error:', e.error);
      });

      window.addEventListener('unhandledrejection', function (e) {
        console.error('Unhandled promise rejection:', e.reason);
      });

      // ========== Start Application ==========
      initializeApp();
    </script>
  </body>
</html>
